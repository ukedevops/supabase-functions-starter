# ============================================================
# Supabase Edge Functions - Deployment (Staging + Production)
#
# Purpose:
#   - Manual deployment only
#   - Choose environment (staging | production) via workflow_dispatch
#   - Deploy only affected Edge Functions
#   - Allow explicit function override
#   - Allow explicit base ref/SHA
#   - Detect _shared and config.toml changes
#   - Generate an accurate deployment summary
#
# Important:
#   - Does NOT use GitHub Environments.
#   - Secrets are repository-level only.
#   - The `environment` input is used purely as a switch-case selector.
#
# Required repository secrets:
#   - SUPABASE_ACCESS_TOKEN    (shared by both environments)
#   - STAGING_PROJECT_ID       (staging Supabase project ref)
#   - PRODUCTION_PROJECT_ID    (production Supabase project ref)
# ============================================================

name: Deploy Supabase Functions

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

      functions:
        description: >-
          Optional comma-separated function names to deploy.
          Example: invite-user,search-details
        required: false
        type: string
        default: ""

      base:
        description: >-
          Optional base ref/SHA for change detection.
          Leave empty to use the last successful deployment of this workflow
          on the selected branch and environment.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Detect and Deploy Functions (${{ inputs.environment }})
    runs-on: ubuntu-latest

    # ⚠️ IMPORTANT: No `environment:` key here.
    # Secrets are read from repository secrets, not GitHub Environments.

    env:
      INPUT_ENVIRONMENT: ${{ inputs.environment }}
      INPUT_FUNCTIONS: ${{ inputs.functions }}
      INPUT_BASE: ${{ inputs.base }}

      BRANCH_NAME: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}

    steps:
      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # ========================================================
      # Setup GitHub CLI
      # ========================================================

      - name: Setup GitHub CLI
        run: |
          set -euo pipefail
          gh --version

      # ========================================================
      # Resolve environment-specific credentials
      #
      # Switch on INPUT_ENVIRONMENT to pick the right project ID.
      # The access token is shared between both environments.
      #
      # Exports:
      #   SUPABASE_ACCESS_TOKEN  (masked)
      #   SUPABASE_PROJECT_ID
      # to $GITHUB_ENV for later steps.
      # ========================================================

      - name: Resolve environment credentials
        shell: bash
        env:
          SECRET_SUPABASE_ACCESS_TOKEN: 'fdf'
          SECRET_STAGING_PROJECT_ID:    'dfdsf'
          SECRET_PRODUCTION_PROJECT_ID: 'dsfd'
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Resolving credentials for: $INPUT_ENVIRONMENT"
          echo "=============================================="

          case "$INPUT_ENVIRONMENT" in
            staging)
              ACCESS_TOKEN="$SECRET_SUPABASE_ACCESS_TOKEN"
              PROJECT_ID="$SECRET_STAGING_PROJECT_ID"
              ;;
            production)
              ACCESS_TOKEN="$SECRET_SUPABASE_ACCESS_TOKEN"
              PROJECT_ID="$SECRET_PRODUCTION_PROJECT_ID"
              ;;
            *)
              echo "ERROR: Unsupported environment: $INPUT_ENVIRONMENT"
              exit 1
              ;;
          esac

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Missing SUPABASE access token."
            echo "       Repo secret SUPABASE_ACCESS_TOKEN is empty."
            exit 1
          fi

          if [ -z "$PROJECT_ID" ]; then
            echo "ERROR: Missing SUPABASE project ID for environment: $INPUT_ENVIRONMENT"
            echo "       Check repo secret STAGING_PROJECT_ID or PRODUCTION_PROJECT_ID."
            exit 1
          fi

          # Mask token in logs.
          echo "::add-mask::$ACCESS_TOKEN"

          {
            echo "SUPABASE_ACCESS_TOKEN=$ACCESS_TOKEN"
            echo "SUPABASE_PROJECT_ID=$PROJECT_ID"
          } >> "$GITHUB_ENV"

          echo "Credentials resolved:"
          echo "  Environment : $INPUT_ENVIRONMENT"
          echo "  Project ID  : $PROJECT_ID"
          echo "  Token       : <masked>"

      # ========================================================
      # Deployment information
      # ========================================================

      - name: Deployment information
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Supabase Edge Functions - $INPUT_ENVIRONMENT"
          echo "=============================================="
          echo "Branch       : $BRANCH_NAME"
          echo "Commit       : $COMMIT_SHA"
          echo "Project      : $SUPABASE_PROJECT_ID"
          echo "Manual input : ${INPUT_FUNCTIONS:-<none>}"
          echo "Base input   : ${INPUT_BASE:-<auto>}"
          echo "=============================================="

      # ========================================================
      # Setup Supabase CLI
      # ========================================================

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # ========================================================
      # Resolve comparison base
      # ========================================================

      - name: Resolve comparison base
        id: base
        if: ${{ env.INPUT_FUNCTIONS == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Resolving comparison base"
          echo "=============================================="

          BASE=""

          # ------------------------------------------------------
          # 1. Manual base supplied
          # ------------------------------------------------------

          if [ -n "$INPUT_BASE" ]; then
            echo "Using manually supplied base:"
            echo "$INPUT_BASE"

            BASE="$INPUT_BASE"

            git fetch --all --tags --prune

            if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
              echo ""
              echo "ERROR: Base ref/SHA does not exist:"
              echo "$BASE"
              exit 1
            fi

          else
            # ----------------------------------------------------
            # 2. Last successful deployment for THIS environment
            # ----------------------------------------------------

            echo "No base supplied."
            echo "Finding the last successful deployment for environment:"
            echo "$INPUT_ENVIRONMENT"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Branch  : $BRANCH_NAME"

            LAST_SUCCESS_SHA="$(
              gh run list \
                --workflow "$GITHUB_WORKFLOW" \
                --branch "$BRANCH_NAME" \
                --status success \
                --json headSha,displayTitle \
                --limit 50 \
                --jq ".[] | select(.displayTitle | test(\"($INPUT_ENVIRONMENT)\")) | .headSha" \
                | head -n1
            )"

            if [ -n "$LAST_SUCCESS_SHA" ]; then
              BASE="$LAST_SUCCESS_SHA"

              echo ""
              echo "Last successful $INPUT_ENVIRONMENT deployment found:"
              echo "$BASE"

              if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
                echo ""
                echo "Fetching missing base commit..."

                git fetch origin "$BASE"

                if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
                  echo ""
                  echo "ERROR: Unable to resolve base commit:"
                  echo "$BASE"
                  exit 1
                fi
              fi

            else
              echo ""
              echo "ERROR: Could not find a previous successful $INPUT_ENVIRONMENT deployment."
              echo ""
              echo "This is expected for the first deployment of this environment."
              echo ""
              echo "Please provide either:"
              echo "  functions: function-a,function-b"
              echo "or:"
              echo "  base: <branch/ref/SHA>"
              echo ""
              exit 1
            fi
          fi

          # ------------------------------------------------------
          # Final validation
          # ------------------------------------------------------

          if ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            echo ""
            echo "ERROR: Unable to resolve comparison base:"
            echo "$BASE"
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "Resolved base:"
          echo "$BASE"
          echo "=============================================="

          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      # ========================================================
      # Detect changed functions
      # ========================================================

      - name: Detect changed functions
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Detecting changed functions"
          echo "=============================================="

          # ------------------------------------------------------
          # Explicit function input
          # ------------------------------------------------------

          if [ -n "$INPUT_FUNCTIONS" ]; then
            echo ""
            echo "Explicit function list supplied."
            echo "Automatic change detection will be skipped."

            FUNCTIONS="$(
              printf '%s' "$INPUT_FUNCTIONS" |
                tr ',' '\n' |
                sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
                sed '/^$/d' |
                sort -u
            )"

            if [ -z "$FUNCTIONS" ]; then
              echo ""
              echo "ERROR: The functions input did not contain any function names."
              exit 1
            fi

            while IFS= read -r FUNCTION; do
              [ -z "$FUNCTION" ] && continue

              if ! printf '%s' "$FUNCTION" | grep -Eq '^[A-Za-z0-9_-]+$'; then
                echo ""
                echo "ERROR: Invalid function name:"
                echo "$FUNCTION"
                echo "Allowed characters: A-Z, a-z, 0-9, underscore, hyphen."
                exit 1
              fi

              if [ ! -d "supabase/functions/$FUNCTION" ]; then
                echo ""
                echo "ERROR: Function does not exist:"
                echo "supabase/functions/$FUNCTION"
                exit 1
              fi
            done <<< "$FUNCTIONS"

            echo ""
            echo "Functions selected explicitly:"
            echo "$FUNCTIONS"

            {
              echo "functions<<EOF"
              echo "$FUNCTIONS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "source=manual" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          # ------------------------------------------------------
          # Automatic change detection
          # ------------------------------------------------------

          if [ -z "$BASE_SHA" ]; then
            echo ""
            echo "ERROR: No comparison base was resolved."
            echo "Please provide the 'base' input or explicit 'functions'."
            exit 1
          fi

          echo ""
          echo "Base:"
          echo "$BASE_SHA"

          echo ""
          echo "HEAD:"
          echo "$COMMIT_SHA"

          CHANGED_FILES="$(
            git diff \
              --name-only \
              "$BASE_SHA...HEAD"
          )"

          echo ""
          echo "Changed files:"
          echo "----------------------------------------------"

          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES"
          else
            echo "No changed files."
          fi

          echo "----------------------------------------------"

          # ------------------------------------------------------
          # Detect shared code changes
          # ------------------------------------------------------

          if printf '%s\n' "$CHANGED_FILES" |
            grep -q '^supabase/functions/_shared/'; then

            echo ""
            echo "=============================================="
            echo "⚠️ WARNING: _shared changes detected"
            echo "=============================================="
            echo ""

            echo "::warning title=Shared function code changed::_shared changes detected. Verify all affected functions are included in the deployment list."

            echo "Shared code has changed:"
            printf '%s\n' "$CHANGED_FILES" |
              grep '^supabase/functions/_shared/' |
              sed 's/^/  /'
            echo ""
            echo "The workflow will continue with the detected function deployment list."
            echo "Please ensure all functions affected by the shared change are included."
            echo ""
          fi

          # ------------------------------------------------------
          # Detect Supabase function configuration changes
          # ------------------------------------------------------

          if printf '%s\n' "$CHANGED_FILES" |
            grep -q '^supabase/config.toml$'; then

            echo ""
            echo "=============================================="
            echo "Manual function selection required"
            echo "=============================================="
            echo ""
            echo "supabase/config.toml changes detected."
            echo ""
            echo "Function configuration can affect deployment behavior."
            echo "Please re-run the workflow with:"
            echo ""
            echo "functions: function-a,function-b,function-c"
            echo ""
            exit 1
          fi

          # ------------------------------------------------------
          # Detect actual function directories only
          # ------------------------------------------------------

          FUNCTIONS=""

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue

            case "$FILE" in
              supabase/functions/*)
                FUNCTION="$(printf '%s' "$FILE" | cut -d '/' -f 3)"

                if [ "$FUNCTION" = "_shared" ]; then
                  continue
                fi

                if [ -d "supabase/functions/$FUNCTION" ]; then
                  FUNCTIONS="${FUNCTIONS}${FUNCTION}"$'\n'
                fi
                ;;
            esac
          done <<< "$CHANGED_FILES"

          FUNCTIONS="$(
            printf '%s\n' "$FUNCTIONS" |
              sed '/^$/d' |
              sort -u
          )"

          echo ""
          echo "Detected functions:"
          echo "----------------------------------------------"

          if [ -n "$FUNCTIONS" ]; then
            echo "$FUNCTIONS"
          else
            echo "None"
          fi

          echo "----------------------------------------------"

          # ------------------------------------------------------
          # No function changes
          # ------------------------------------------------------

          if [ -z "$FUNCTIONS" ]; then
            echo ""
            echo "No Edge Function changes detected."

            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "source=diff" >> "$GITHUB_OUTPUT"

            {
              echo "functions<<EOF"
              echo ""
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            exit 0
          fi

          {
            echo "functions<<EOF"
            echo "$FUNCTIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "source=diff" >> "$GITHUB_OUTPUT"

      # ========================================================
      # Deploy functions
      # ========================================================

      - name: Deploy functions
        id: deploy
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          FUNCTIONS: ${{ steps.changes.outputs.functions }}
        run: |
          set -uo pipefail

          DEPLOYED=""
          FAILED=""

          echo "=============================================="
          echo "Deploying Functions - $INPUT_ENVIRONMENT"
          echo "=============================================="

          while IFS= read -r FUNCTION; do
            [ -z "$FUNCTION" ] && continue

            echo ""
            echo "----------------------------------------------"
            echo "Deploying: $FUNCTION ($INPUT_ENVIRONMENT)"
            echo "----------------------------------------------"

            if supabase functions deploy "$FUNCTION" \
              --project-ref "$SUPABASE_PROJECT_ID"; then

              echo "SUCCESS: $FUNCTION"
              DEPLOYED="${DEPLOYED}${FUNCTION}"$'\n'

            else

              echo "FAILED: $FUNCTION"
              FAILED="${FAILED}${FUNCTION}"$'\n'

            fi
          done <<< "$FUNCTIONS"

          {
            echo "deployed<<EOF"
            echo "$DEPLOYED"
            echo "EOF"

            echo "failed<<EOF"
            echo "$FAILED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$FAILED" ]; then
            echo ""
            echo "One or more functions failed."
            exit 1
          fi

      # ========================================================
      # Deployment summary
      # ========================================================

      - name: Generate deployment summary
        if: always()
        shell: bash
        env:
          FUNCTIONS: ${{ steps.changes.outputs.functions }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
          FAILED: ${{ steps.deploy.outputs.failed }}
          HAS_CHANGES: ${{ steps.changes.outputs.has_changes }}
          CHANGE_SOURCE: ${{ steps.changes.outputs.source }}
          BASE_SHA: ${{ steps.base.outputs.base }}
          BASE_OUTCOME: ${{ steps.base.outcome }}
          CHANGES_OUTCOME: ${{ steps.changes.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -u

          if [ "$INPUT_ENVIRONMENT" = "production" ]; then
            TITLE_EMOJI="🚀"
            TITLE_LABEL="Production"
          else
            TITLE_EMOJI="🧪"
            TITLE_LABEL="Staging"
          fi

          {
            echo "# ${TITLE_EMOJI} Supabase Functions - ${TITLE_LABEL}"
            echo ""

            echo "## Deployment Information"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Environment | \`$INPUT_ENVIRONMENT\` |"
            echo "| Branch | \`$BRANCH_NAME\` |"
            echo "| Commit | \`$COMMIT_SHA\` |"
            echo "| Base | \`${BASE_SHA:-not required}\` |"
            echo "| Project | \`${SUPABASE_PROJECT_ID:-not resolved}\` |"
            echo "| Trigger | Manual |"
            echo "| Detection | \`${CHANGE_SOURCE:-not completed}\` |"
            echo ""

            if [ "${BASE_OUTCOME:-}" = "failure" ]; then

              echo "## ❌ Base Resolution Failed"
              echo ""
              echo "The workflow could not determine a comparison base."
              echo ""
              echo "For the first deployment, provide either:"
              echo ""
              echo "- \`functions: function-a,function-b\`"
              echo "- \`base: <branch/ref/SHA>\`"
              echo ""

            elif [ "${CHANGES_OUTCOME:-}" = "failure" ]; then

              echo "## ❌ Change Detection Failed"
              echo ""
              echo "The workflow could not determine which functions should be deployed."
              echo ""

            elif [ "${HAS_CHANGES:-false}" != "true" ]; then

              echo "## ℹ️ No Function Changes"
              echo ""
              echo "No Edge Function changes were detected."
              echo ""

            else

              echo "## Functions"
              echo ""
              echo "| Function | Status |"
              echo "|---|---|"

              if [ -n "${DEPLOYED:-}" ]; then
                while IFS= read -r FUNCTION; do
                  [ -z "$FUNCTION" ] && continue
                  echo "| \`$FUNCTION\` | ✅ Deployed |"
                done <<< "$DEPLOYED"
              fi

              if [ -n "${FAILED:-}" ]; then
                while IFS= read -r FUNCTION; do
                  [ -z "$FUNCTION" ] && continue
                  echo "| \`$FUNCTION\` | ❌ Failed |"
                done <<< "$FAILED"
              fi

              echo ""

              case "${DEPLOY_OUTCOME:-unknown}" in

                success)
                  echo "## ✅ Deployment Completed"
                  echo ""
                  echo "All selected functions were deployed successfully."
                  ;;

                failure)
                  echo "## ❌ Deployment Failed"
                  echo ""
                  echo "One or more functions failed to deploy."
                  ;;

                skipped)
                  echo "## ⏭️ Deployment Skipped"
                  echo ""
                  echo "No deployment was performed."
                  ;;

                cancelled)
                  echo "## 🛑 Deployment Cancelled"
                  echo ""
                  echo "The deployment was cancelled."
                  ;;

                *)
                  echo "## ⚠️ Deployment Did Not Complete"
                  echo ""
                  echo "The deployment step did not complete normally."
                  ;;

              esac

            fi

            echo ""
            echo "---"
            echo ""
            echo "Workflow: \`$GITHUB_WORKFLOW\`"
            echo "Run: \`$GITHUB_RUN_ID\`"

          } >> "$GITHUB_STEP_SUMMARY"
