name: Deploy Functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Comma separated function names"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1

      - name: Deploy Selected Functions
        run: |
          echo '${{ inputs.functions }}' > functions.json

          jq -r '
            to_entries[]
            | select(.value == true)
            | .key
          ' functions.json | while read fn
          do
            echo "Deploying $fn"

            if [ -d "supabase/functions/$fn" ]; then
              supabase functions deploy "$fn"
            else
              echo "Function not found: $fn"
              exit 1
            fi
          done
