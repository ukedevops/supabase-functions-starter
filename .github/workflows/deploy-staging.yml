```yaml
name: Deploy Supabase Functions to Staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Functions
    runs-on: ubuntu-latest

    outputs:
      functions: ${{ steps.detect.outputs.functions }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2

      - name: Show branch information
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Detect changed functions
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking changed files..."

          CHANGED_FILES="$(git diff --name-only HEAD^ HEAD || true)"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          FUNCTIONS=""

          while IFS= read -r FILE; do
            if [[ "$FILE" =~ ^supabase/functions/([^/]+)/ ]]; then
              FUNCTION="${BASH_REMATCH[1]}"

              if [[ "$FUNCTION" != "_shared" ]]; then
                FUNCTIONS="${FUNCTIONS}${FUNCTION}"$'\n'
              fi
            fi
          done <<< "$CHANGED_FILES"

          UNIQUE_FUNCTIONS="$(printf '%s' "$FUNCTIONS" | sort -u | sed '/^$/d')"

          if [ -z "$UNIQUE_FUNCTIONS" ]; then
            echo "No Supabase function changes found."

            echo 'functions=[]' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "Changed functions:"
          echo "$UNIQUE_FUNCTIONS"

          FUNCTIONS_JSON="$(
            printf '%s\n' "$UNIQUE_FUNCTIONS" |
            jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"

          echo "Functions JSON:"
          echo "$FUNCTIONS_JSON"

          echo "functions=$FUNCTIONS_JSON" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"


  deploy:
    name: Deploy ${{ matrix.function }}
    needs: detect-changes

    if: needs.detect-changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        function: ${{ fromJSON(needs.detect-changes.outputs.functions) }}

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      FUNCTION_NAME: ${{ matrix.function }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show deployment information
        run: |
          echo "======================================"
          echo "Supabase Function Deployment"
          echo "======================================"
          echo "Branch   : ${{ github.ref_name }}"
          echo "Commit   : ${{ github.sha }}"
          echo "Function : $FUNCTION_NAME"
          echo "Project  : $SUPABASE_PROJECT_ID"
          echo "======================================"

      - name: Validate function
        run: |
          set -euo pipefail

          FUNCTION_PATH="supabase/functions/$FUNCTION_NAME"

          if [ ! -d "$FUNCTION_PATH" ]; then
            echo "Function directory does not exist:"
            echo "$FUNCTION_PATH"
            exit 1
          fi

          echo "Function found:"
          echo "$FUNCTION_PATH"

      - name: Link Supabase project
        run: |
          set -euo pipefail

          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy function
        id: deploy
        run: |
          set -euo pipefail

          echo "Deploying function: $FUNCTION_NAME"

          supabase functions deploy "$FUNCTION_NAME" \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment..."
          sleep 15

      - name: Health check
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          FUNCTION_URL="${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}"

          echo "======================================"
          echo "Health Check"
          echo "======================================"
          echo "URL: $FUNCTION_URL"
          echo "======================================"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output /tmp/function-response.txt \
              --write-out "%{http_code}" \
              --max-time 30 \
              --request GET \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              "$FUNCTION_URL"
          )"

          echo "HTTP Status: $HTTP_STATUS"

          echo "Response:"
          cat /tmp/function-response.txt || true

          if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "Health check PASSED."
            exit 0
          fi

          echo "Health check FAILED."
          exit 1

      - name: Rollback function
        if: steps.health.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "ROLLBACK STARTED"
          echo "======================================"

          echo "Function: $FUNCTION_NAME"
          echo "Current commit: $GITHUB_SHA"

          PREVIOUS_COMMIT="$(git rev-parse HEAD^)"

          echo "Previous commit: $PREVIOUS_COMMIT"

          git checkout "$PREVIOUS_COMMIT" -- \
            "supabase/functions/$FUNCTION_NAME"

          echo "Previous function version restored."

          supabase functions deploy "$FUNCTION_NAME" \
            --project-ref "$SUPABASE_PROJECT_ID"

          echo "Rollback deployment completed."

      - name: Wait for rollback
        if: steps.health.outcome == 'failure'
        run: |
          echo "Waiting for rollback..."
          sleep 15

      - name: Verify rollback
        if: steps.health.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail

          FUNCTION_URL="${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}"

          echo "======================================"
          echo "VERIFYING ROLLBACK"
          echo "======================================"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output /tmp/rollback-response.txt \
              --write-out "%{http_code}" \
              --max-time 30 \
              --request GET \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              "$FUNCTION_URL"
          )"

          echo "Rollback HTTP Status: $HTTP_STATUS"

          echo "Rollback response:"
          cat /tmp/rollback-response.txt || true

          if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "Rollback verification PASSED."
          else
            echo "CRITICAL: Rollback verification FAILED."
            exit 1
          fi

      - name: Fail deployment after rollback
        if: steps.health.outcome == 'failure'
        run: |
          echo "The new deployment failed health checks."
          echo "The previous version was restored."
          exit 1

      - name: Deployment successful
        if: steps.health.outcome == 'success'
        run: |
          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Function: $FUNCTION_NAME"
          echo "Branch: ${{ github.ref_name }}"
```
