```yaml
name: Deploy Supabase Functions to Staging

on:
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changed Functions
    runs-on: ubuntu-latest

    outputs:
      functions: ${{ steps.changed-functions.outputs.functions }}
      has_changes: ${{ steps.changed-functions.outputs.has_changes }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2

      - name: Show deployment branch
        run: |
          echo "======================================"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "======================================"

      - name: Detect changed Supabase functions
        id: changed-functions
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking changed files..."

          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD || true)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          FUNCTIONS=()

          while IFS= read -r file; do

            if [[ "$file" =~ ^supabase/functions/([^/]+)/ ]]; then

              FUNCTION="${BASH_REMATCH[1]}"

              # Ignore shared code directory
              if [[ "$FUNCTION" != "_shared" ]]; then
                FUNCTIONS+=("$FUNCTION")
              fi

            fi

          done <<< "$CHANGED_FILES"

          # Remove duplicate function names
          UNIQUE_FUNCTIONS=$(printf "%s\n" "${FUNCTIONS[@]}" | sort -u)

          if [[ -z "$UNIQUE_FUNCTIONS" ]]; then

            echo "No Supabase function changes detected."

            echo "functions=[]" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          echo ""
          echo "Changed Supabase functions:"
          echo "$UNIQUE_FUNCTIONS"

          # Convert function names into JSON array
          FUNCTIONS_JSON=$(
            printf '%s\n' "$UNIQUE_FUNCTIONS" |
            jq -R -s -c 'split("\n") | map(select(length > 0))'
          )

          echo ""
          echo "Functions JSON:"
          echo "$FUNCTIONS_JSON"

          echo "functions=$FUNCTIONS_JSON" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"


  deploy:
    name: Deploy ${{ matrix.function }}
    needs: detect-changes

    if: needs.detect-changes.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        function: ${{ fromJSON(needs.detect-changes.outputs.functions) }}

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}

      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      FUNCTION_NAME: ${{ matrix.function }}

    steps:

      # --------------------------------------------------
      # Checkout selected branch
      # --------------------------------------------------

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2

      # --------------------------------------------------
      # Setup Supabase CLI
      # --------------------------------------------------

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # --------------------------------------------------
      # Show information
      # --------------------------------------------------

      - name: Deployment information
        run: |
          echo "======================================"
          echo "Supabase Function Deployment"
          echo "======================================"
          echo "Branch       : ${{ github.ref_name }}"
          echo "Commit       : ${{ github.sha }}"
          echo "Function     : $FUNCTION_NAME"
          echo "Project      : $SUPABASE_PROJECT_ID"
          echo "======================================"

      # --------------------------------------------------
      # Validate function
      # --------------------------------------------------

      - name: Validate function directory
        run: |
          set -euo pipefail

          FUNCTION_PATH="supabase/functions/$FUNCTION_NAME"

          if [ ! -d "$FUNCTION_PATH" ]; then
            echo "ERROR: Function directory does not exist:"
            echo "$FUNCTION_PATH"
            exit 1
          fi

          echo "Function directory found:"
          echo "$FUNCTION_PATH"

          ls -la "$FUNCTION_PATH"

      # --------------------------------------------------
      # Link Supabase project
      # --------------------------------------------------

      - name: Link Supabase project
        run: |
          set -euo pipefail

          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID"

      # --------------------------------------------------
      # Deploy function
      # --------------------------------------------------

      - name: Deploy function
        id: deploy
        run: |
          set -euo pipefail

          echo "Deploying:"
          echo "$FUNCTION_NAME"

          supabase functions deploy "$FUNCTION_NAME" \
            --project-ref "$SUPABASE_PROJECT_ID"

          echo "Function deployment completed."

      # --------------------------------------------------
      # Wait for deployment
      # --------------------------------------------------

      - name: Wait for deployment
        run: |
          echo "Waiting for function deployment..."

          sleep 15

      # --------------------------------------------------
      # Health check
      # --------------------------------------------------

      - name: Health check
        id: health-check
        run: |
          set -euo pipefail

          FUNCTION_URL="${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}"

          echo "======================================"
          echo "Health Check"
          echo "======================================"
          echo "Function:"
          echo "$FUNCTION_NAME"
          echo ""
          echo "URL:"
          echo "$FUNCTION_URL"
          echo "======================================"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/function-response.txt \
            --write-out "%{http_code}" \
            --max-time 30 \
            --request GET \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            "$FUNCTION_URL")

          echo ""
          echo "HTTP Status: $HTTP_STATUS"

          echo ""
          echo "Response:"
          cat /tmp/function-response.txt || true

          echo ""

          # Accept 2xx responses
          if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then

            echo "======================================"
            echo "Health check PASSED"
            echo "======================================"

            exit 0

          fi

          echo "======================================"
          echo "Health check FAILED"
          echo "======================================"

          exit 1

      # --------------------------------------------------
      # Rollback
      # --------------------------------------------------

      - name: Checkout previous function version
        if: failure()
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Preparing rollback"
          echo "======================================"

          echo "Function:"
          echo "$FUNCTION_NAME"

          echo "Previous commit:"
          git rev-parse HEAD^

          # Restore function from previous commit
          git checkout HEAD^ -- \
            "supabase/functions/$FUNCTION_NAME"

          echo ""
          echo "Previous function version restored."

          echo ""
          echo "Files:"
          ls -la "supabase/functions/$FUNCTION_NAME"

      # --------------------------------------------------
      # Redeploy previous version
      # --------------------------------------------------

      - name: Rollback function
        if: failure()
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Rolling back function"
          echo "======================================"

          echo "Function:"
          echo "$FUNCTION_NAME"

          supabase functions deploy "$FUNCTION_NAME" \
            --project-ref "$SUPABASE_PROJECT_ID"

          echo ""
          echo "Rollback deployment completed."

      # --------------------------------------------------
      # Wait for rollback
      # --------------------------------------------------

      - name: Wait for rollback
        if: failure()
        run: |
          echo "Waiting for rollback deployment..."

          sleep 15

      # --------------------------------------------------
      # Verify rollback
      # --------------------------------------------------

      - name: Verify rollback
        if: failure()
        run: |
          set -euo pipefail

          FUNCTION_URL="${SUPABASE_URL}/functions/v1/${FUNCTION_NAME}"

          echo "======================================"
          echo "Rollback Health Check"
          echo "======================================"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/rollback-response.txt \
            --write-out "%{http_code}" \
            --max-time 30 \
            --request GET \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            "$FUNCTION_URL")

          echo ""
          echo "Rollback HTTP Status: $HTTP_STATUS"

          echo ""
          echo "Rollback response:"
          cat /tmp/rollback-response.txt || true

          echo ""

          if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then

            echo "======================================"
            echo "Rollback successful"
            echo "======================================"

          else

            echo "======================================"
            echo "CRITICAL: Rollback verification FAILED"
            echo "======================================"

            exit 1

          fi

          # Important:
          # The original deployment failed, therefore the job
          # must remain failed even though rollback succeeded.

          exit 1

      # --------------------------------------------------
      # Success summary
      # --------------------------------------------------

      - name: Deployment successful
        if: success()
        run: |
          echo "======================================"
          echo "Deployment successful"
          echo "======================================"
          echo "Function: $FUNCTION_NAME"
          echo "Branch  : ${{ github.ref_name }}"
          echo "======================================"
```
